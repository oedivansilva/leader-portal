<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Controle de Presença</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<header class="topbar"><div class="brand">Portal do Líder</div><div class="userbox"><div><strong data-user-name></strong><small data-user-role></small></div><a class="btn btn-light" href="leader.html">Solicitações</a><a class="btn btn-light" href="profile.html">Meu perfil</a><button class="btn btn-danger" onclick="logout()">Sair</button></div></header>
<main class="main" style="max-width:1150px;margin:auto"><div class="page-head"><div><h1>Controle de Presença</h1><p class="muted">Registre faltas justificadas e injustificadas.</p></div></div>
<section class="card"><div class="toolbar"><input id="presenceSearch" class="input" placeholder="Pesquisar MAT ou nome" style="max-width:300px"><select id="presenceOperationFilter" class="input" style="max-width:320px"></select><select id="presenceShiftFilter" class="input" style="max-width:220px"></select></div><form id="absenceForm" class="grid-2"><div class="field"><label>Colaborador</label><select id="absenceEmployee" class="input" required></select></div><div class="field"><label>Tipo</label><select id="absenceType" class="input"><option value="injustificada">Falta injustificada</option><option value="justificada">Falta justificada (atestado)</option></select></div><div class="field"><label>Data da falta</label><div style="display:flex;gap:8px"><input id="absenceDate" type="date" class="input"><button type="button" class="btn btn-primary" onclick="addAbsenceDate()">+ Adicionar</button></div><div id="absenceDatesList" style="margin-top:8px"><span class="muted">Nenhuma data adicionada.</span></div></div><div class="field"><label>Observação</label><textarea id="absenceNotes" class="input" rows="3" placeholder="Opcional"></textarea></div><button class="btn btn-success" style="grid-column:1/-1">Registrar falta</button></form></section>
<section class="card table-wrap"><h2>Registros recentes</h2><table class="table"><thead><tr><th>Data</th><th>MAT</th><th>Colaborador</th><th>Operação</th><th>Tipo</th><th>Observação</th></tr></thead><tbody id="absenceRows"></tbody></table></section></main><script src="config.js"></script><script src="common.js"></script><script src="presence.js"></script></body></html>
