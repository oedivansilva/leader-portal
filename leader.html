<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Líder — Portal do Líder</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<header class="topbar"><div class="brand">Portal do Líder</div><div class="userbox"><div><strong data-user-name></strong><small data-user-role></small></div><button class="btn btn-danger" onclick="logout()">Sair</button></div></header><main class="main" style="max-width:1100px;margin:auto"><div class="page-head"><div><h1>Solicitações disciplinares</h1><p id="leaderContext" class="muted"></p></div><button class="btn btn-primary" onclick="document.getElementById('requestCard').classList.toggle('hidden')">+ Nova solicitação</button></div>
<section id="requestCard" class="card hidden"><h2>Nova solicitação</h2><form id="requestForm" class="grid-2"><div class="field"><label>Nome do colaborador</label><input id="employeeName" class="input" required></div><div class="field"><label>Operação</label><input id="requestLocation" class="input" readonly></div><div class="field"><label>Tipo de medida</label><select id="penaltyType" class="input"><option>Advertência</option><option>Suspensão</option></select></div><div class="field"><label>Motivo</label><select id="reasonId" class="input" required></select></div><div id="suspensionField" class="field hidden"><label>Dias de suspensão</label><select id="suspensionDays" class="input"><option value="1">1 dia</option><option value="3">3 dias</option></select></div><div class="field"><label>Data da ocorrência</label><input id="incidentDate" type="date" class="input" required></div><div class="field"><label>Data de emissão</label><input id="issueDate" type="date" class="input" required></div><button class="btn btn-success" style="grid-column:1/-1">Enviar solicitação</button></form></section>
<section class="card table-wrap"><table class="table"><thead><tr><th>Colaborador</th><th>Medida</th><th>Ocorrência</th><th>Status</th><th>Criado em</th></tr></thead><tbody id="leaderRequestRows"></tbody></table></section></main><script src="config.js"></script><script src="common.js"></script><script src="leader.js"></script></body></html>
