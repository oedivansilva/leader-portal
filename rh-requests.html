<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#EE4D2D">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Solicitações de RH — NEXO</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<header class="topbar">
<button class="mobile-menu" onclick="toggleSidebar()">☰</button>
<div class="brand" aria-label="NEXO — Gestão de Pessoas e Operações"><span class="brand-mark" aria-hidden="true">N</span><span class="brand-copy"><strong>NEXO</strong><small>Gestão de Pessoas e Operações</small></span></div>
<div class="userbox"><div><strong data-user-name></strong><small data-user-role></small></div><a class="btn btn-light" href="profile.html">Meu perfil</a><button class="btn btn-danger" onclick="logout()">Sair</button></div>
</header>
<div class="app">
<aside id="portalSidebar" class="sidebar"></aside>
<main class="main">
<div class="page-head"><div><h1>Solicitações de RH</h1><p class="muted">Como Administrador/RH, você recebe e trata as solicitações operacionais sem depender de um acesso Onsite separado.</p></div><button class="btn btn-light" onclick="loadRequests()">Atualizar</button></div>
<div class="card" style="margin-bottom:14px"><div class="toolbar rh-request-filters"><input id="rhRequestSearch" class="input" placeholder="Buscar colaborador ou operação..."><select id="rhRequestStatus" class="input"><option value="">Todos os status</option><option value="pendente">Pendente</option><option value="aguardando_atribuicao">Aguardando RH/Onsite</option><option value="atribuido">Atribuído</option><option value="gerado">Gerado</option><option value="aplicado">Aplicado</option></select></div></div>
<section class="card table-wrap">
<table class="table"><thead><tr><th>Colaborador</th><th>Operação</th><th>Medida</th><th>Motivo</th><th>Status</th><th>Documento</th><th>Aplicação</th><th>Ações</th></tr></thead><tbody id="rhRequestRows"></tbody></table>
</section>
</main>
</div>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="request-editor.js"></script>
<script src="pdf.js"></script>
<script src="rh-requests.js"></script>
</body>
</html>
