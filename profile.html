<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu perfil — Portal do Líder</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<header class="topbar"><button class="mobile-menu" onclick="toggleSidebar()">☰</button><div class="brand">Portal do Líder</div><div class="userbox"><div><strong data-user-name></strong><small data-user-role></small></div><button class="btn btn-danger" onclick="logout()">Sair</button></div></header>
<div class="app"><aside id="profileSidebar" class="sidebar"></aside><main class="main"><div class="page-head"><div><h1>Meu perfil</h1><p class="muted">Atualize seus dados pessoais e sua senha.</p></div></div><section class="card"><h2>Dados pessoais</h2><form id="profileForm" class="grid-2"><div class="field"><label>Nome completo</label><input id="profileName" class="input" required></div><div class="field"><label>E-mail</label><input id="profileEmail" class="input" readonly></div><div class="field"><label>Celular</label><input id="profilePhone" class="input" required></div><div class="field"><label>Perfil de acesso</label><input id="profileRole" class="input" readonly></div><button class="btn btn-success" style="grid-column:1/-1">Salvar dados</button></form></section><section class="card"><h2>Alterar senha</h2><form id="ownPasswordForm" class="grid-2"><div class="field"><label>Nova senha</label><input id="ownPassword" type="password" minlength="8" class="input" required></div><div class="field"><label>Confirmar nova senha</label><input id="ownPasswordConfirmation" type="password" minlength="8" class="input" required></div><button class="btn btn-primary" style="grid-column:1/-1">Alterar senha</button></form></section></main></div><script src="config.js"></script><script src="common.js"></script><script src="profile.js"></script></body></html>
