<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Líder - Medidas Disciplinares</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Biblioteca jsPDF para geração automática de PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Navegação -->
    <nav class="bg-blue-800 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold">Portal do Líder</h1>
        <button id="btnLogout" class="hidden bg-red-600 px-4 py-2 rounded text-sm hover:bg-red-700">Sair</button>
    </nav>

    <div class="container mx-auto p-6">
        
        <!-- Tela de Acesso (Login / Cadastro) -->
        <div id="loginScreen" class="max-w-md mx-auto bg-white p-8 rounded shadow-md mt-10">
            <!-- Abas de Navegação -->
            <div class="flex border-b mb-6">
                <button id="tabLoginBtn" onclick="switchTab('login')" class="w-1/2 py-2 font-bold border-b-2 border-blue-600 text-blue-600">Entrar</button>
                <button id="tabRegisterBtn" onclick="switchTab('register')" class="w-1/2 py-2 font-bold text-gray-500">Criar Conta</button>
            </div>

            <!-- Formulário de Login -->
            <form id="formLogin" onsubmit="event.preventDefault(); login();">
                <input type="email" id="email" placeholder="E-mail" required class="w-full p-2 mb-4 border rounded">
                <input type="password" id="password" placeholder="Senha" required class="w-full p-2 mb-6 border rounded">
                <button type="submit" class="w-full bg-blue-700 text-white font-bold py-2 rounded hover:bg-blue-800">Entrar</button>
            </form>

            <!-- Formulário de Cadastro (Oculto por padrão) -->
            <form id="formRegister" class="hidden" onsubmit="event.preventDefault(); register();">
                <input type="text" id="regName" placeholder="Nome Completo" required class="w-full p-2 mb-4 border rounded">
                <input type="email" id="regEmail" placeholder="E-mail" required class="w-full p-2 mb-4 border rounded">
                <input type="password" id="regPassword" placeholder="Senha (mín. 6 caracteres)" required class="w-full p-2 mb-4 border rounded">
                
                <label class="block text-sm font-medium mb-1">Perfil de Acesso</label>
                <select id="regRole" class="w-full p-2 mb-6 border rounded">
                    <option value="leader">Líder / Gestor</option>
                    <option value="onsite">Equipe Onsite</option>
                </select>
                
                <button type="submit" class="w-full bg-green-600 text-white font-bold py-2 rounded hover:bg-green-700">Cadastrar</button>
            </form>
        </div>

        <!-- Tela do Líder (Solicitação e Acompanhamento) -->
        <div id="leaderScreen" class="hidden max-w-3xl mx-auto bg-white p-8 rounded shadow-md mt-4">
            <h2 class="text-2xl font-bold mb-6 border-b pb-2">Nova Solicitação de Documento</h2>
            <form id="requestForm" onsubmit="submitRequest(event)">
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Nome do Colaborador</label>
                        <input type="text" id="empName" required class="w-full p-2 border rounded">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Local/Site</label>
                        <input type="text" id="location" required class="w-full p-2 border rounded">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Tipo de Medida</label>
                        <select id="penaltyType" required class="w-full p-2 border rounded">
                            <option value="Advertência">Advertência Escrita</option>
                            <option value="Suspensão">Suspensão</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Alínea (Motivo)</label>
                        <select id="reasonId" onchange="showReasonDesc()" required class="w-full p-2 border rounded">
                            <!-- Preenchido via JS -->
                        </select>
                    </div>
                </div>
                
                <p id="reasonDesc" class="text-sm text-gray-500 bg-gray-100 p-2 rounded mb-4 hidden"></p>

                <!-- Campo de Múltiplas Datas do Ocorrido -->
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div>
                        <label class="block text-sm font-medium mb-1">Datas do Ocorrido / Faltas</label>
                        <div class="flex gap-2 mb-2">
                            <input type="date" id="incidentDateInput" class="w-full p-2 border rounded">
                            <button type="button" onclick="addIncidentDate()" class="bg-blue-600 text-white px-3 py-2 rounded text-sm hover:bg-blue-700 whitespace-nowrap">+ Adicionar</button>
                        </div>
                        <div id="selectedDatesList" class="flex flex-wrap gap-2 min-h-[42px] p-2 bg-gray-50 border rounded items-center">
                            <span class="text-xs text-gray-400" id="noDatesMsg">Nenhuma data adicionada</span>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Data de Emissão (Doc)</label>
                        <input type="date" id="issueDate" required class="w-full p-2 border rounded">
                    </div>
                </div>

                <button type="submit" class="w-full bg-green-600 text-white font-bold py-3 rounded hover:bg-green-700 mb-8">Solicitar Documento</button>
            </form>

            <!-- Tabela de Acompanhamento para o Líder -->
            <div class="pt-6 border-t border-gray-200">
                <h3 class="text-xl font-bold mb-4 text-gray-800">Minhas Solicitações</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-100 text-sm uppercase">
                                <th class="p-3 border-b">Colaborador</th>
                                <th class="p-3 border-b">Medida</th>
                                <th class="p-3 border-b">Status</th>
                                <th class="p-3 border-b text-center">Documento</th>
                            </tr>
                        </thead>
                        <tbody id="leaderRequestsTableBody">
                            <!-- Preenchido via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Tela do Onsite (Gestão) -->
        <div id="onsiteScreen" class="hidden bg-white p-8 rounded shadow-md mt-4">
            <h2 class="text-2xl font-bold mb-6 border-b pb-2">Painel Onsite - Solicitações Pendentes</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-sm uppercase">
                            <th class="p-3 border-b">Colaborador</th>
                            <th class="p-3 border-b">Medida</th>
                            <th class="p-3 border-b">Motivo</th>
                            <th class="p-3 border-b">Data Doc.</th>
                            <th class="p-3 border-b text-center">Ação</th>
                        </tr>
                    </thead>
                    <tbody id="requestsTableBody">
                        <!-- Preenchido via JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
    // 1. Inicialização do Supabase
    const SUPABASE_URL = 'https://gagedjappvouhbsfzlmd.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdhZ2VkamFwcHZvdWhic2Z6bG1kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NDkzMzYsImV4cCI6MjEwMTMyNTMzNn0.3Z4mM8ZWxjQ7TTPYtY_GY7yqlVcSkvxmRxYyfy-Wmpg';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let currentProfile = null;
    let reasonsData = [];
    let selectedDates = [];

    // 2. Alternar entre Login e Cadastro
    function switchTab(tab) {
        const formLogin = document.getElementById('formLogin');
        const formRegister = document.getElementById('formRegister');
        const tabLoginBtn = document.getElementById('tabLoginBtn');
        const tabRegisterBtn = document.getElementById('tabRegisterBtn');

        if (tab === 'login') {
            formLogin.classList.remove('hidden');
            formRegister.classList.add('hidden');
            tabLoginBtn.className = "w-1/2 py-2 font-bold border-b-2 border-blue-600 text-blue-600";
            tabRegisterBtn.className = "w-1/2 py-2 font-bold text-gray-500";
        } else {
            formLogin.classList.add('hidden');
            formRegister.classList.remove('hidden');
            tabRegisterBtn.className = "w-1/2 py-2 font-bold border-b-2 border-green-600 text-green-600";
            tabLoginBtn.className = "w-1/2 py-2 font-bold text-gray-500";
        }
    }

    // 3. Autenticação e Cadastro
    async function register() {
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPassword').value;
        const fullName = document.getElementById('regName').value;
        const role = document.getElementById('regRole').value;

        const { data, error } = await supabaseClient.auth.signUp({
            email: email,
            password: password,
            options: {
                data: {
                    full_name: fullName,
                    role: role
                }
            }
        });

        if (error) {
            alert('Erro ao realizar cadastro: ' + error.message);
        } else {
            alert('Cadastro realizado com sucesso! Você já pode fazer login.');
            switchTab('login');
        }
    }

    async function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        
        if (error) {
            alert('Erro ao fazer login: ' + error.message);
            return;
        }
        checkUser();
    }

    async function checkUser() {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (user) {
            currentUser = user;
            
            const { data: profile, error } = await supabaseClient.from('profiles').select('*').eq('id', user.id).single();
            
            if (error || !profile) {
                alert('Usuário autenticado, mas o perfil ainda não foi registrado na tabela profiles.');
                return;
            }

            currentProfile = profile;
            
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('btnLogout').classList.remove('hidden');

            if (profile.role === 'leader') {
                document.getElementById('leaderScreen').classList.remove('hidden');
                loadReasons();
                loadLeaderRequests();
            } else if (profile.role === 'onsite') {
                document.getElementById('onsiteScreen').classList.remove('hidden');
                loadRequests();
            }
        }
    }

    document.getElementById('btnLogout').addEventListener('click', async () => {
        await supabaseClient.auth.signOut();
        location.reload();
    });

    // 4. Gerenciamento de Datas Múltiplas
    function addIncidentDate() {
        const input = document.getElementById('incidentDateInput');
        const val = input.value;
        if (!val) return;
        
        if (!selectedDates.includes(val)) {
            selectedDates.push(val);
            renderSelectedDates();
        }
        input.value = '';
    }

    function removeIncidentDate(dateToRemove) {
        selectedDates = selectedDates.filter(d => d !== dateToRemove);
        renderSelectedDates();
    }

    function renderSelectedDates() {
        const container = document.getElementById('selectedDatesList');
        if (selectedDates.length === 0) {
            container.innerHTML = '<span class="text-xs text-gray-400">Nenhuma data adicionada</span>';
            return;
        }
        
        const sortedDates = [...selectedDates].sort();
        
        container.innerHTML = sortedDates.map(d => {
            const formatted = d.split('-').reverse().join('/');
            return `
                <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-1 rounded flex items-center gap-1">
                    ${formatted}
                    <button type="button" onclick="removeIncidentDate('${d}')" class="text-blue-600 hover:text-red-600 font-bold ml-1">✕</button>
                </span>
            `;
        }).join('');
    }

    // 5. Funções do Líder
    async function loadReasons() {
        const { data, error } = await supabaseClient.from('penalty_reasons').select('*');
        if (data) {
            reasonsData = data;
            const select = document.getElementById('reasonId');
            select.innerHTML = '<option value="">Selecione...</option>';
            data.forEach(r => {
                select.innerHTML += `<option value="${r.id}">${r.code} - ${r.title}</option>`;
            });
        }
    }

    function showReasonDesc() {
        const id = document.getElementById('reasonId').value;
        const descEl = document.getElementById('reasonDesc');
        if (id) {
            const reason = reasonsData.find(r => r.id == id);
            descEl.textContent = reason.description;
            descEl.classList.remove('hidden');
        } else {
            descEl.classList.add('hidden');
        }
    }

    async function submitRequest(e) {
        e.preventDefault();

        if (selectedDates.length === 0) {
            alert('Por favor, adicione pelo menos uma data de ocorrência.');
            return;
        }

        const formattedDates = [...selectedDates]
            .sort()
            .map(d => d.split('-').reverse().join('/'))
            .join(', ');

        const request = {
            leader_id: currentUser.id,
            employee_name: document.getElementById('empName').value,
            location: document.getElementById('location').value,
            penalty_type: document.getElementById('penaltyType').value,
            reason_id: document.getElementById('reasonId').value,
            incident_date: formattedDates,
            issue_date: document.getElementById('issueDate').value
        };

        const { error } = await supabaseClient.from('disciplinary_requests').insert([request]);
        
        if (error) {
            alert('Erro ao solicitar: ' + error.message);
        } else {
            alert('Solicitação enviada com sucesso para o Onsite!');
            e.target.reset();
            selectedDates = [];
            renderSelectedDates();
            document.getElementById('reasonDesc').classList.add('hidden');
            loadLeaderRequests();
        }
    }

    async function loadLeaderRequests() {
        const { data, error } = await supabaseClient
            .from('disciplinary_requests')
            .select('*')
            .eq('leader_id', currentUser.id)
            .order('created_at', { ascending: false });

        const tbody = document.getElementById('leaderRequestsTableBody');
        if (!tbody) return;
        tbody.innerHTML = '';

        if (data && data.length > 0) {
            data.forEach(req => {
                const isReady = req.status === 'gerado' || req.status === 'concluido';
                
                const statusBadge = isReady
                    ? '<span class="bg-green-100 text-green-800 text-xs font-semibold px-2.5 py-0.5 rounded">Pronto</span>'
                    : '<span class="bg-yellow-100 text-yellow-800 text-xs font-semibold px-2.5 py-0.5 rounded">Pendente</span>';

                const actionBtn = isReady && req.document_url
                    ? `<a href="${req.document_url}" target="_blank" class="bg-blue-600 text-white px-3 py-1 rounded text-xs hover:bg-blue-700 font-bold inline-block">Baixar PDF</a>`
                    : '<span class="text-xs text-gray-400">Em processamento</span>';

                tbody.innerHTML += `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-3 font-medium text-sm">${req.employee_name}</td>
                        <td class="p-3 text-sm">${req.penalty_type}</td>
                        <td class="p-3">${statusBadge}</td>
                        <td class="p-3 text-center">${actionBtn}</td>
                    </tr>
                `;
            });
        } else {
            tbody.innerHTML = '<tr><td colspan="4" class="p-3 text-center text-gray-400 text-sm">Nenhuma solicitação encontrada.</td></tr>';
        }
    }

    // 6. Funções do Onsite
    async function loadRequests() {
        const { data, error } = await supabaseClient
            .from('disciplinary_requests')
            .select('*, penalty_reasons(code)')
            .eq('status', 'pendente');

        const tbody = document.getElementById('requestsTableBody');
        tbody.innerHTML = '';

        if (data) {
            data.forEach(req => {
                tbody.innerHTML += `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-3">${req.employee_name} <br><span class="text-xs text-gray-500">${req.location}</span></td>
                        <td class="p-3 font-semibold">${req.penalty_type}</td>
                        <td class="p-3 text-sm">${req.penalty_reasons ? req.penalty_reasons.code : '-'}</td>
                        <td class="p-3 text-sm">${req.issue_date.split('-').reverse().join('/')}</td>
                        <td class="p-3 text-center">
                            <button onclick="generateDoc('${req.id}')" class="bg-blue-600 text-white px-3 py-1 rounded text-sm hover:bg-blue-700">GERAR DOCUMENTO</button>
                        </td>
                    </tr>
                `;
            });
        }
    }

    // GERAÇÃO AUTOMÁTICA DE PDF
    async function generateDoc(requestId) {
        const { data: req, error: fetchError } = await supabaseClient
            .from('disciplinary_requests')
            .select('*, penalty_reasons(*)')
            .eq('id', requestId)
            .single();

        if (fetchError || !req) {
            alert('Erro ao carregar dados da solicitação.');
            return;
        }

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const isAdvertencia = req.penalty_type.toLowerCase().includes('advertência');

        // Título e Local/Data
        doc.setFont("helvetica", "bold");
        doc.setFontSize(14);
        const title = isAdvertencia ? "ADVERTÊNCIA DISCIPLINAR" : "CARTA DE SUSPENSÃO";
        doc.text(title, 105, 25, { align: "center" });

        doc.setFontSize(10);
        doc.setFont("helvetica", "normal");
        doc.text(`${req.location || 'Ananindeua'}, ${req.issue_date.split('-').reverse().join('/')}`, 20, 35);

        // Dados do Colaborador
        doc.setFont("helvetica", "bold");
        doc.text(`ADVERTIMOS: ${req.employee_name.toUpperCase()}`, 20, 50);
        doc.setFont("helvetica", "normal");

        const alineCode = req.penalty_reasons ? req.penalty_reasons.code : 'H';
        const reasonDesc = req.penalty_reasons ? req.penalty_reasons.description : 'Faltas injustificadas';

        // Texto legal
        let bodyText = "";
        if (isAdvertencia) {
            bodyText = `Em conformidade com o ARTIGO 482 alínea ${alineCode} da C.L.T., vimos adverti-lo pelo seguinte motivo:\n\n` +
                       `Ato de indisciplina: ${reasonDesc} ocorridas em: ${req.incident_date}.\n\n` +
                       `Esperamos que tome as providências necessárias para que a irregularidade acima não se repita. ` +
                       `Aproveitamos para esclarecer que a repetição ou prática de condutas semelhantes poderá resultar em penalidades ` +
                       `mais severas, inclusive a demissão por justa causa, conforme previsto no Artigo 482 e suas alíneas da CLT.`;
        } else {
            bodyText = `Pela presente fica V.Sa. suspenso das atividades laborais em razão das irregularidades em virtude de ` +
                       `${reasonDesc} ocorridas nas datas: ${req.incident_date}.\n\n` +
                       `Lembramos que a reincidência deste comportamento poderá resultar em justa causa conforme artigo 482 da CLT.`;
        }

        const splitBody = doc.splitTextToSize(bodyText, 170);
        doc.text(splitBody, 20, 65);

        // Assinaturas
        const ySign = 160;
        doc.text("Atenciosamente,", 20, ySign);
        
        doc.line(20, ySign + 20, 95, ySign + 20);
        doc.text("WE CAN BR – TRABALHO TEMPORARIO LTDA", 20, ySign + 25);

        doc.line(115, ySign + 20, 190, ySign + 20);
        doc.text("Assinatura do Colaborador", 115, ySign + 25);

        doc.line(20, ySign + 45, 95, ySign + 45);
        doc.text("Testemunha 1", 20, ySign + 50);

        doc.line(115, ySign + 45, 190, ySign + 45);
        doc.text("Testemunha 2", 115, ySign + 50);

        // Converter para URI e salvar no banco
        const pdfDataUrl = doc.output('datauristring');

        const { error: updateError } = await supabaseClient
            .from('disciplinary_requests')
            .update({ 
                status: 'gerado', 
                document_url: pdfDataUrl 
            })
            .eq('id', requestId);

        if (updateError) {
            alert('Erro ao salvar o documento: ' + updateError.message);
        } else {
            alert('Documento PDF gerado com sucesso!');
            loadRequests();
        }
    }

    window.onload = checkUser;
</script>
</body>
</html>
