<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal do Líder — Acesso</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<header class="topbar"><div class="brand">Portal do Líder</div></header>
<main class="auth-shell">
  <section id="loginCard" class="auth-card"><h1>Acesso ao portal</h1><p class="muted">Entre com a conta fornecida pelo administrador.</p><form id="loginForm" class="stack"><div class="field"><label>E-mail</label><input id="email" type="email" class="input" required></div><div class="field"><label>Senha</label><input id="password" type="password" class="input" required></div><button class="btn btn-primary">Entrar</button></form></section>
  <section id="passwordCard" class="auth-card hidden"><h1>Crie sua senha pessoal</h1><p class="muted">Substitua a senha temporária antes de continuar.</p><form id="passwordForm" class="stack"><div class="field"><label>Nova senha</label><input id="newPassword" type="password" minlength="8" class="input" required></div><div class="field"><label>Confirmar senha</label><input id="confirmPassword" type="password" minlength="8" class="input" required></div><button class="btn btn-primary">Salvar e continuar</button></form></section>
</main><script src="config.js"></script><script src="common.js"></script><script src="login.js"></script></body></html>
